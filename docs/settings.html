<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>딜봇 설정</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body data-page="settings">
  <header>
    <h1>딜봇</h1>
    <nav><a href="./">피드</a><a href="settings.html" aria-current="page">설정</a></nav>
  </header>
  <main>
    <div id="forms"><p class="muted">불러오는 중…</p></div>

    <div class="savebar">
      <button id="save" class="primary">저장</button>
      <div id="result" class="result" aria-live="polite"></div>
    </div>

    <h2>GitHub 연결</h2>
    <section class="card">
      <div class="field"><span>저장소 (owner/repo)</span><input id="repo" type="text" autocomplete="off" spellcheck="false"></div>
      <div class="field"><span>Fine-grained PAT</span>
        <input id="token" type="password" autocomplete="off" placeholder="github_pat_…">
        <small>이 저장소만, Contents: Read and write 권한만, 만료 90일. 이 브라우저(localStorage)에만 저장됩니다.</small>
      </div>
      <div class="row">
        <button id="savetoken" type="button">저장·확인</button>
        <button id="cleartoken" type="button" class="danger">토큰 지우기</button>
        <span id="tokstate" class="muted"></span>
      </div>
    </section>
  </main>
</body>
</html>
