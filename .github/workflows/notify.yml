# Sends notifications after a Codex app run (ChatGPT subscription) pushes its data commit.
# The Codex scheduled task on the PC does search + collect + playbook and pushes "codex: run ...";
# notification secrets live only here in GitHub. Pushes made with GITHUB_TOKEN (below) do not
# trigger workflows again, so there is no loop.
name: notify

on:
  push:
    branches: [main]
    paths: ["data/runs.json"]
  schedule:
    - cron: "5 23 * * *"   # 08:05 KST: send instant alerts held back by quiet_hours (default end 08:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dealbot-data
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event_name != 'push' || startsWith(github.event.head_commit.message, 'codex: run')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Notify (CODEX.md step 5)
        run: python scripts/notify.py --since-run
        env:
          DEALBOT_SLACK_WEBHOOK: ${{ secrets.DEALBOT_SLACK_WEBHOOK }}
          DEALBOT_DISCORD_WEBHOOK: ${{ secrets.DEALBOT_DISCORD_WEBHOOK }}
          DEALBOT_TELEGRAM_TOKEN: ${{ secrets.DEALBOT_TELEGRAM_TOKEN }}
          DEALBOT_TELEGRAM_CHAT_ID: ${{ secrets.DEALBOT_TELEGRAM_CHAT_ID }}
          DEALBOT_NTFY_TOPIC: ${{ secrets.DEALBOT_NTFY_TOPIC }}
          DEALBOT_NTFY_TOKEN: ${{ secrets.DEALBOT_NTFY_TOKEN }}
          DEALBOT_NTFY_SERVER: ${{ secrets.DEALBOT_NTFY_SERVER }}
          DEALBOT_PUSHOVER_TOKEN: ${{ secrets.DEALBOT_PUSHOVER_TOKEN }}
          DEALBOT_PUSHOVER_USER: ${{ secrets.DEALBOT_PUSHOVER_USER }}
          DEALBOT_KAKAO_REST_KEY: ${{ secrets.DEALBOT_KAKAO_REST_KEY }}
          DEALBOT_KAKAO_REFRESH_TOKEN: ${{ secrets.DEALBOT_KAKAO_REFRESH_TOKEN }}
          DEALBOT_KAKAO_CLIENT_SECRET: ${{ secrets.DEALBOT_KAKAO_CLIENT_SECRET }}
          DEALBOT_SMTP_HOST: ${{ secrets.DEALBOT_SMTP_HOST }}
          DEALBOT_SMTP_USER: ${{ secrets.DEALBOT_SMTP_USER }}
          DEALBOT_SMTP_PASS: ${{ secrets.DEALBOT_SMTP_PASS }}
          DEALBOT_SMTP_PORT: ${{ secrets.DEALBOT_SMTP_PORT }}
          DEALBOT_EMAIL_TO: ${{ secrets.DEALBOT_EMAIL_TO }}
      - name: Commit notified marks and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/validate.py --quiet || { echo "validate failed; not committing"; exit 1; }
          git config user.name "dealbot-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "actions: notify $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do
            git pull -q --rebase "$remote" main && git push -q "$remote" HEAD:main && exit 0
            sleep 5
          done
          echo "push failed"; exit 1
