# DealBot fallback / API-key runner.
#
# Main path (ChatGPT subscription): a Codex desktop-app scheduled task on the user's PC runs
# CODEX.md whenever a run is due (every 24h, or a 지금 새로 찾기 request from the page; the task
# polls hourly and scripts/due.py decides) and pushes "codex: run ..."; notify.yml then sends the
# notifications. This workflow polls every 3 hours and only runs when the PC missed a due run by
# 3h or left a page request open for 2h (PC off). Then it collects the script sources (RSS/Epic).
# With an OPENAI_API_KEY secret (API billing) it also runs Codex here:
#
#   job gate     scripts/due.py --slack 3 --request-wait 2 (scheduled runs only)
#   job search   Codex web search (CODEX.md step 2)          -> artifact search.json  [needs OPENAI_API_KEY]
#   job collect  sources + dedupe + filter + validate + notify + review (steps 3-5)
#                -> commit data/ and push; artifact review.json
#   job learn    Codex improves data/playbook.md (step 6)     -> commit and push        [needs OPENAI_API_KEY]
#
# openai/codex-action drops sudo for safety and can run only once per job, hence three jobs.
# Without OPENAI_API_KEY only `collect` does work (RSS/Epic sources, no web search, no learning).
# Secrets: Settings -> Secrets and variables -> Actions -> Secrets (never Variables: those are not masked).
name: dealbot

on:
  schedule:
    - cron: "30 */3 * * *"   # every 3 hours; the gate decides (only when the PC missed a due run or a request)
  workflow_dispatch:
    inputs:
      search:
        description: "Codex 웹 검색·플레이북 개선 실행 (OPENAI_API_KEY 필요)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: dealbot-data
  cancel-in-progress: false

env:
  USE_CODEX: ${{ secrets.OPENAI_API_KEY != '' && (github.event_name == 'schedule' || inputs.search) }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: check
        run: |
          pip install -q -r requirements.txt
          # PC gets the first chance: 3h of slack on the 24h interval, 2h on page requests
          check=$(python3 scripts/due.py --slack 3 --request-wait 2)
          echo "$check" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${check%% *}" != "yes" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  search:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      ran: ${{ steps.flag.outputs.ran }}
      outcome: ${{ steps.codex.outcome }}
    steps:
      - id: flag
        run: echo "ran=$USE_CODEX" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: env.USE_CODEX == 'true'
        with:
          persist-credentials: false
      - if: env.USE_CODEX == 'true'
        run: mkdir -p .tmp
      - name: Codex web search (CODEX.md step 2)
        id: codex
        if: env.USE_CODEX == 'true'
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/search.md
          permission-profile: ":workspace"
          codex-args: '["-c", "web_search=\"live\""]'
          output-file: .tmp/search-report.txt
      - name: Check the result is a JSON array
        if: env.USE_CODEX == 'true'
        run: |
          if [ -f .tmp/search.json ] && ! python3 -c "import json,sys; d=json.load(open('.tmp/search.json', encoding='utf-8')); sys.exit(0 if isinstance(d, list) else 1)"; then
            echo "search.json is not a JSON array; ignoring it"; mv .tmp/search.json .tmp/search.bad.json
          fi
          ls -la .tmp
      - uses: actions/upload-artifact@v4
        if: env.USE_CODEX == 'true'
        with:
          name: search
          path: |
            .tmp/search.json
            .tmp/search-report.txt
          if-no-files-found: ignore
          retention-days: 7

  collect:
    needs: [gate, search]
    if: always() && needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      validated: ${{ steps.validate.outcome }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && mkdir -p .tmp
      - uses: actions/download-artifact@v4
        if: needs.search.outputs.ran == 'true'
        continue-on-error: true
        with:
          name: search
          path: .tmp

      - name: Collect, dedupe, filter, record (CODEX.md step 3)
        env:
          RAN: ${{ needs.search.outputs.ran }}
          OUTCOME: ${{ needs.search.outputs.outcome }}
        run: |
          args=()
          [ -f .tmp/search.json ] && args+=(--extra .tmp/search.json)
          if [ "$RAN" = "true" ] && [ "$OUTCOME" != "success" ]; then
            args+=(--source-error "search=Codex 검색 단계 실패 (Actions 로그 확인)")
          fi
          python scripts/run_deterministic.py "${args[@]}"

      - name: Validate (CODEX.md step 4)
        id: validate
        run: python scripts/validate.py --record

      - name: Notify (CODEX.md step 5)
        if: steps.validate.outcome == 'success'
        run: python scripts/notify.py --since-run
        env:
          DEALBOT_SLACK_WEBHOOK: ${{ secrets.DEALBOT_SLACK_WEBHOOK }}
          DEALBOT_DISCORD_WEBHOOK: ${{ secrets.DEALBOT_DISCORD_WEBHOOK }}
          DEALBOT_TELEGRAM_TOKEN: ${{ secrets.DEALBOT_TELEGRAM_TOKEN }}
          DEALBOT_TELEGRAM_CHAT_ID: ${{ secrets.DEALBOT_TELEGRAM_CHAT_ID }}
          DEALBOT_NTFY_TOPIC: ${{ secrets.DEALBOT_NTFY_TOPIC }}
          DEALBOT_NTFY_TOKEN: ${{ secrets.DEALBOT_NTFY_TOKEN }}
          DEALBOT_NTFY_SERVER: ${{ secrets.DEALBOT_NTFY_SERVER }}
          DEALBOT_PUSHOVER_TOKEN: ${{ secrets.DEALBOT_PUSHOVER_TOKEN }}
          DEALBOT_PUSHOVER_USER: ${{ secrets.DEALBOT_PUSHOVER_USER }}
          DEALBOT_KAKAO_REST_KEY: ${{ secrets.DEALBOT_KAKAO_REST_KEY }}
          DEALBOT_KAKAO_REFRESH_TOKEN: ${{ secrets.DEALBOT_KAKAO_REFRESH_TOKEN }}
          DEALBOT_KAKAO_CLIENT_SECRET: ${{ secrets.DEALBOT_KAKAO_CLIENT_SECRET }}
          DEALBOT_SMTP_HOST: ${{ secrets.DEALBOT_SMTP_HOST }}
          DEALBOT_SMTP_USER: ${{ secrets.DEALBOT_SMTP_USER }}
          DEALBOT_SMTP_PASS: ${{ secrets.DEALBOT_SMTP_PASS }}
          DEALBOT_SMTP_PORT: ${{ secrets.DEALBOT_SMTP_PORT }}
          DEALBOT_EMAIL_TO: ${{ secrets.DEALBOT_EMAIL_TO }}

      - name: Review the run (CODEX.md step 6, deterministic part)
        if: steps.validate.outcome == 'success'
        run: python scripts/review_run.py > .tmp/review.json

      - name: Commit data/ and push
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.validate.outcome }}" != "success" ]; then
            git checkout -- data/feed.json data/seen.json 2>/dev/null || true
          fi
          git config user.name "dealbot-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          stamp=$(python -c "import json;print(json.load(open('data/runs.json'))['runs'][0]['at'][:16].replace('T',' '))")
          new=$(python -c "import json;print(json.load(open('data/runs.json'))['runs'][0]['new'])")
          prefix=actions; [ "${{ needs.search.outputs.ran }}" = "true" ] && prefix=codex
          git commit -q -m "$prefix: run ${stamp} (+${new} new)"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do
            git pull -q --rebase "$remote" main && git push -q "$remote" HEAD:main && exit 0
            sleep 5
          done
          echo "push failed"; exit 1

      - uses: actions/upload-artifact@v4
        if: steps.validate.outcome == 'success'
        with:
          name: review
          path: .tmp/review.json
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r = json.load(open("data/runs.json", encoding="utf-8"))["runs"][0]
          errs = ", ".join(f"{e['source']}: {e['error']}" for e in r["errors"]) or "없음"
          print(f"찾은 {r['found']}건, 새 {r['new']}건, 알림 {r['notified']}건, 출처별 {r['by_source']}, 오류: {errs}")
          PY
          if [ -f .tmp/search-report.txt ]; then { echo; echo "### Codex 검색 보고"; cat .tmp/search-report.txt; } >> "$GITHUB_STEP_SUMMARY"; fi

  learn:
    needs: collect
    if: needs.collect.outputs.validated == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Skip without OPENAI_API_KEY
        if: env.USE_CODEX != 'true'
        run: echo "OPENAI_API_KEY 없음 또는 수동 실행에서 끔 - 플레이북 학습 생략"
      - uses: actions/checkout@v5
        if: env.USE_CODEX == 'true'
        with:
          ref: main                    # includes the data commit from `collect`
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: env.USE_CODEX == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: env.USE_CODEX == 'true'
        run: pip install -r requirements.txt && mkdir -p .tmp
      - uses: actions/download-artifact@v4
        if: env.USE_CODEX == 'true'
        with:
          name: review
          path: .tmp
      - uses: actions/download-artifact@v4
        if: env.USE_CODEX == 'true'
        continue-on-error: true
        with:
          name: search
          path: .tmp

      - name: Codex improves the playbook (CODEX.md step 6)
        id: codex
        if: env.USE_CODEX == 'true'
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/review.md
          permission-profile: ":workspace"
          output-file: .tmp/review-report.txt

      - name: Keep only playbook edits, validate, commit and push
        if: env.USE_CODEX == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp data/playbook.md "$RUNNER_TEMP/playbook.md"
          git checkout -- . && git clean -fdq -e .tmp/
          cp "$RUNNER_TEMP/playbook.md" data/playbook.md
          if ! python scripts/validate.py --quiet; then
            echo "playbook edit failed validation; discarding it"; exit 0
          fi
          if git diff --quiet -- data/playbook.md; then echo "playbook unchanged"; exit 0; fi
          git config user.name "dealbot-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/playbook.md
          git commit -q -m "codex: learn playbook $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for i in 1 2 3; do
            git pull -q --rebase "$remote" main && git push -q "$remote" HEAD:main && exit 0
            sleep 5
          done
          echo "push failed"; exit 1

      - name: Summary
        if: env.USE_CODEX == 'true'
        run: |
          { echo "### Codex 회고 보고"; cat .tmp/review-report.txt 2>/dev/null || echo "(보고 없음)"; } >> "$GITHUB_STEP_SUMMARY"
